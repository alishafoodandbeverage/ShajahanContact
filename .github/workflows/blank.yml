name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract zip
        run: |
          ls -la
          if [ -f ShajahanContact.zip ]; then
            unzip -o ShajahanContact.zip
            if [ -d ShajahanContact ]; then
              cp -r ShajahanContact/* . || true
              cp -r ShajahanContact/.[!.]* . 2>/dev/null || true
            fi
          fi
          find . -name "settings.gradle.kts" | head -5

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v3

      - name: Build
        run: |
          PROJECT_DIR=$(find . -name "settings.gradle.kts" | head -1 | xargs dirname)
          echo "Project: $PROJECT_DIR"
          cd "$PROJECT_DIR" || cd .
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          gradle wrapper --gradle-version 8.2 || true
          chmod +x gradlew 2>/dev/null || true
          if [ -f ./gradlew ]; then ./gradlew assembleDebug --stacktrace --no-daemon
          else gradle assembleDebug --stacktrace --no-daemon; fi
          find . -name "*.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Shajahan-Contact-APK
          path: "**/*.apk"
          if-no-files-found: warn
